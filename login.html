<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutelaris | Login</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='login_style.css') }}">
</head>

<body>

    <main class="auth-page">

        <!-- LEFT / BRAND SECTION -->
        <section class="brand-section">

            <div class="brand">
                <div class="brand-shield">🛡</div>

                <div>
                    <h1>Tutelaris</h1>
                    <p>Your Safety, Our Priority</p>
                </div>
            </div>

            <div class="brand-content">

                <div class="shield-circle">
                    🛡️
                </div>

                <h2>
                    Welcome<br>
                    <span>Back!</span>
                </h2>

                <p>
                    Smart AI assistance and real-time support
                    for your safety, anytime, anywhere.
                </p>

            </div>

            <div class="decor-circle circle-one"></div>
            <div class="decor-circle circle-two"></div>

        </section>


        <!-- LOGIN SECTION -->
        <section class="form-section">

            <div class="form-container">

                <div class="form-icon">
                    🔐
                </div>

                <h2>Login to Your Account</h2>

                <p class="form-subtitle">
                    We're glad to have you back.
                </p>


                <form action="{{ url_for('login') }}" method="POST">

                    <!-- EMAIL -->
                    <div class="input-group">

                        <span class="input-icon">✉</span>

                        <input
    type="email"
    name="email"
    placeholder="Email Address"
    required
>

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <span class="input-icon">🔒</span>

                        <input
    type="password"
    id="loginPassword"
    name="password"
    placeholder="Password"
    required
>

                        <button
                            type="button"
                            class="password-button"
                            onclick="togglePassword('loginPassword', this)"
                        >
                            👁
                        </button>

                    </div>


                    <!-- OPTIONS -->
                    <div class="login-options">

                        <label>
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="main-button">
                        Login
                        <span>→</span>
                    </button>

                </form>


                <!-- DIVIDER -->
                <div class="divider">
                    <span></span>
                    <p>or continue with</p>
                    <span></span>
                </div>


                <!-- SOCIAL BUTTONS -->
                <div class="social-buttons">

                    <button type="button">
                        <span class="google-icon">G</span>
                        Google
                    </button>

                    <button type="button">
                        <span class="apple-icon">●</span>
                        Apple
                    </button>

                </div>


                <!-- SIGNUP LINK -->
                <p class="bottom-text">
                    Don't have an account?
                    <a href="{{ url_for('signup') }}">Create Account</a>
                </p>

            </div>

        </section>

    </main>


    <!-- PASSWORD TOGGLE -->
    <script>
        function togglePassword(inputId, button) {

            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }

        }
    </script>

</body>
</html>
