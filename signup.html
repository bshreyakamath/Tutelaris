<link rel="stylesheet" href="login.css">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tutelaris | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <!-- LEFT / BRAND SECTION -->
        <section class="brand-section signup-brand">

            <div class="brand">

                <div class="brand-shield">
                    🛡
                </div>

                <div>
                    <h1>Tutelaris</h1>

                    <p>
                        Your Safety, Our Priority
                    </p>
                </div>

            </div>


            <div class="brand-content">

                <div class="shield-circle">
                    👩🏻
                </div>

                <h2>
                    Your Safety,<br>
                    <span>Our Priority</span>
                </h2>

                <p>
                    Create your secure account and get
                    access to smart AI-powered safety
                    assistance.
                </p>

            </div>


            <div class="decor-circle circle-one"></div>
            <div class="decor-circle circle-two"></div>

        </section>


        <!-- SIGNUP FORM -->
        <section class="form-section">

            <div class="form-container signup-container">

                <div class="form-icon">
                    👤
                </div>

                <h2>Create Your Account</h2>

                <p class="form-subtitle">
                    Join Tutelaris and take control of your safety.
                </p>


                <form>

                    <!-- NAME -->
                    <div class="input-group">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            placeholder="Full Name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            placeholder="Email Address"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create Password"
                            required
                        >

                        <button
                            type="button"
                            class="password-button"
                            onclick="togglePassword('signupPassword', this)"
                        >
                            👁
                        </button>

                    </div>


                    <!-- NICKNAME -->
                    <div class="input-group">

                        <span class="input-icon">📞</span>

                        <input
                            type="text"
                            placeholder="Nickname for AI Fake Call"
                            required
                        >

                        <span
                            class="info-icon"
                            title="The AI will use this nickname during the fake call."
                        >
                            ⓘ
                        </span>

                    </div>


                    <!-- EMERGENCY CONTACT -->
                    <div class="input-group">

                        <span class="input-icon">📱</span>

                        <input
                            type="tel"
                            placeholder="Emergency Contact Number"
                            required
                        >

                    </div>


                    <!-- AGE -->
                    <div class="input-group">

                        <span class="input-icon">🎂</span>

                        <input
                            type="number"
                            placeholder="Age"
                            min="1"
                            max="120"
                            required
                        >

                    </div>


                    <!-- TERMS -->
                    <label class="terms">

                        <input type="checkbox" required>

                        <span>
                            I agree to the
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </span>

                    </label>


                    <!-- CREATE ACCOUNT -->
                    <button
                        type="submit"
                        class="main-button"
                    >
                        Create Account
                        <span>→</span>
                    </button>

                </form>


                <!-- LOGIN LINK -->
                <p class="bottom-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </section>

    </main>


    <!-- PASSWORD TOGGLE -->
    <script>

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";

            }

        }

    </script>

</body>
</html>
